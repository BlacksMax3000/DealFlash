name: Radar de Ofertas

on:
  schedule:
    # Cada 2 horas, minuto 37 (UTC). GitHub Actions puede retrasar unos minutos.
    - cron: "37 */2 * * *"
  workflow_dispatch: {}   # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write         # necesario para commitear data/ y site/ de vuelta
  pages: write            # despliegue del sitio de captación en GitHub Pages
  id-token: write         # autenticación OIDC del deploy de Pages

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar el Radar (recolectar → filtrar → GLM → publicar → captar)
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          # ---- captación automática (opcionales) ----
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          TELEGRAM_CHANNEL_URL: ${{ secrets.TELEGRAM_CHANNEL_URL }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}       # vacío = se deduce del repo
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          DISCORD_WEBHOOK_URLS: ${{ secrets.DISCORD_WEBHOOK_URLS }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
        run: python -m radar.main

      - name: Persistir BD + sitio de captación (deduplicación y SEO entre ciclos)
        run: |
          git config user.name "radar-de-ofertas[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ 2>/dev/null || true
          git add site/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Sin cambios que commitear"
          else
            git commit -m "chore(radar): actualizar radar.db y sitio de captación [skip ci]"
            git push
          fi

      - name: Empaquetar sitio de captación
        if: ${{ hashFiles('site/**') != '' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar sitio de captación en GitHub Pages
        if: ${{ hashFiles('site/**') != '' }}
        id: deployment
        continue-on-error: true   # si aún no activaste Pages (README, Paso 9) no tumba el ciclo
        uses: actions/deploy-pages@v4
